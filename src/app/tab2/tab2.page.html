<ion-header class="ion-no-border header-moodmap">
  <div class="top-bar-container">
    <div class="logo-circle">
      <span class="logo-text">MM<br><strong>MOOD<br>MAP</strong></span>
    </div>

    <div class="search-bar">
      <ion-icon name="search-outline" class="search-icon"></ion-icon>
      <input 
        type="text" 
        placeholder="¿Qué mood buscás hoy?" 
        [(ngModel)]="searchText"
        (input)="onSearchChange()"
      />
    </div>

    <!-- Perfil: lleva al inicio de sesión -->
    <button class="filter-btn" (click)="goToLogin()">
      <ion-icon name="person-outline"></ion-icon>
    </button>
  </div>
</ion-header>

<ion-content class="content-moodmap" [scrollX]="false" [scrollY]="false">
  <!-- Contenedor del Mapa -->
  <div id="map"></div>

  <!-- Tarjeta Flotante Inferior -->
  <div class="selected-place-card" *ngIf="selectedPlace">
    <button class="close-btn" (click)="closeCard()">✕</button>
    
    <div class="card-body">
      <img [src]="selectedPlace.image" [alt]="selectedPlace.name" class="place-img" />
      
      <div class="place-info">
        <div class="title-row">
          <h3>{{ selectedPlace.name }}</h3>
          <span class="rating">
            {{ selectedPlace.rating }} <ion-icon name="star"></ion-icon>
          </span>
        </div>
        
        <p class="category">{{ selectedPlace.category }} • {{ selectedPlace.mood }}</p>

        <p class="address">
          <ion-icon name="location-outline"></ion-icon> {{ selectedPlace.address }}
        </p>

        <p class="description">{{ selectedPlace.description }}</p>
      </div>
    </div>
  </div>
</ion-content>
